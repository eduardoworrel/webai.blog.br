    limits: ["Vision runs on WASM because vision on WebGPU gives wrong results in onnxruntime-web 1.31.1; that is why it takes about 15 seconds per question.", "Accuracy of 0.925 on 240 ScienceQA questions, which is not the paper's benchmark and sits outside the families the model was trained on. The paper's own numbers were not reproduced.", "The parity tolerances written before the measurements were not met: against a bfloat16 PyTorch oracle (n = 60), the 95th percentile of the probability difference was 0.198 and 6.7% of the decisions flipped.", "Probabilities are raw and overconfident; the order of the options changes the answer; counting objects is the weak spot.", "Chrome or Edge on a computer only, with WebGPU and about 3 GB of free memory. Phones and Safari are not supported.", "This is a research demo. Do not use it for diagnosis, to identify people or in critical automation."],
    credits: ['Base model: <a href="https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct">Qwen3-VL-4B-Instruct</a> (Qwen), Apache-2.0.', 'Adapter: <a href="https://huggingface.co/guanxuyu/visual-jev-4b-answer-sft">guanxuyu/visual-jev-4b-answer-sft</a> (Yu and Yao), Apache-2.0.', 'ONNX weights: <a href="https://huggingface.co/eduardoworrel/Visual-Jev-4B-ONNX-S1S2">eduardoworrel/Visual-Jev-4B-ONNX-S1S2</a> on Hugging Face, Apache-2.0.', 'Library: <a href="https://github.com/eduardoworrel/s1s2.js">s1s2.js</a> (<code>@s1s2/web {v}</code>), with <a href="https://onnxruntime.ai/">ONNX Runtime Web</a> {o} and the tokenizer of <a href="https://github.com/huggingface/transformers.js">transformers.js</a> {t} (Apache-2.0).', 'Example drawings: ours, public domain, made by <a href="exemplos/gerar.py">exemplos/gerar.py</a>.']
  }
};
const qs = new URLSearchParams(location.search);
const LANG = (qs.get("lang") ?? navigator.language ?? "en").toLowerCase().startsWith("pt") ? "pt-BR" : "en";
const T = TX[LANG], en = LANG === "en";
const GB = MODEL_GB.toLocaleString(LANG, { minimumFractionDigits: 1 });
const sub = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const num = (v, d = 1) => v.toLocaleString(LANG, { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v) => `${num(v * 100)} %`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.documentElement.lang = LANG;
$("#home").href = en ? "/en/" : "/";
$("#foot-home").href = en ? "/en/" : "/";
$("#about").href = en ? "/en/about.html" : "/sobre.html";
const sw = $("#trocar"); sw.href = `?lang=${en ? "pt-BR" : "en"}`; sw.textContent = en ? "Português" : "English"; sw.lang = en ? "pt-BR" : "en"; sw.hreflang = sw.lang;
document.title = `${T.title} · webai.blog.br`;
for (const e of document.querySelectorAll("[data-t]")) e.textContent = T[e.dataset.t];
$("#req").innerHTML = sub(T.req, { gb: GB });
$("#what-list").innerHTML = T.what.map((x) => `<li>${sub(x, { gb: GB })}</li>`).join("");
$("#limits").innerHTML = T.limits.map((x) => `<li>${x}</li>`).join("");
$("#credits").innerHTML = T.credits.map((x) => `<li>${sub(x, { v: S1S2_VERSION, o: ORT_VERSION, t: TJS_VERSION })}</li>`).join("");
$("#chips").setAttribute("aria-label", T.chips_label);

// ---- Estado
let model = null, loading = false, running = false, current = null /* { canvas, label } */, ort = null, exIndex = -1, chipIndex = 0;
const setStatus = (s) => { $("#status").textContent = s; };
const notice = (msg) => { const n = $("#aviso-nav"); n.textContent = msg; n.hidden = false; };
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
const events = [];
const navType = performance.getEntriesByType("navigation")[0]?.type ?? "navigate";
if (store.get("vj-sessao") === "1" && (navType === "reload" || navType === "back_forward")) notice(T.oom);
addEventListener("pagehide", (ev) => { events.push({ t: Date.now(), e: "pagehide", persisted: ev.persisted }); });

// ---- Aparelho: celular, Safari, sem WebGPU ou pouca memória => aviso no lugar do botão (com "Tentar mesmo assim")
const ua = navigator.userAgent;
const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const mobile = ios || /Android|Mobi/i.test(ua);
const safari = /^((?!chrome|chromium|crios|edg|android).)*safari/i.test(ua);
async function hasGpu() { try { return !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch { return false; } }

// ---- Contagem dos bytes dos arquivos grandes do Hub, para a barra (nada é guardado no Cache Storage)
let counted = 0, phase = "download";   // "download" mostra a porcentagem; "prep" mostra uma mensagem só (evita a mensagem piscando perto dos 99 %)
function enterPrep() { if (phase === "prep") return; phase = "prep"; $("#bar").removeAttribute("value"); setStatus(T.s_prep); }
function setProgress() {
  if (phase === "prep") return;
  const p = Math.min(99, Math.round(counted / EXPECTED_BYTES * 100));
  if (p >= 99) { enterPrep(); return; }
  $("#bar").value = p;
  setStatus(`${T.s_download}: ${p} %`);
}
function installFetch() {
  if (window.__vjFetch) return;
  const orig = window.fetch.bind(window);
  window.__vjFetch = true;
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    const method = (init?.method ?? (input instanceof Request ? input.method : "GET")).toUpperCase();
    const headers = new Headers(init?.headers ?? (input instanceof Request ? input.headers : undefined));
    if (!url.startsWith(HUB_PREFIX) || method !== "GET" || headers.has("range")) return orig(input, init);
    const r = await orig(input, init);
    const size = Number(r.headers.get("content-length") ?? 0);
    if (!r.ok || !r.body || size < 50e6) return r;
    return new Response(r.body.pipeThrough(new TransformStream({ transform(c, ctl) { counted += c.byteLength; setProgress(); ctl.enqueue(c); } })), { status: 200, headers: r.headers });   // só conta; sem Cache Storage (o Safari estoura a memória ao gravar arquivos de centenas de MB)
  };
}

// ---- Carregar o modelo
const STAGE = [[/loading tokenizer/, "st_tok"], [/loading embeddings/, "st_emb"], [/loading vision/, "st_vis"], [/loading text/, "st_text"]];
function onStatus(m) {
  if (phase === "prep") return;
  const hit = STAGE.find(([re]) => re.test(m));
  if (hit && counted === 0) setStatus(T[hit[1]]);   // durante o download, a porcentagem toma o lugar
}
async function load() {
  if (loading || model) return;
  loading = true;
  const t0 = performance.now();
  $("#load").disabled = true; $("#force").hidden = true; $("#unsupported").hidden = true; $("#load").textContent = T.loading; $("#prog").hidden = false; $("#bar").value = 0; counted = 0; phase = "download";
  try {
    installFetch();
    ort = await import(`${ORT_BASE}ort.all.bundle.min.mjs`);
    ort.env.wasm.wasmPaths = ORT_BASE;
    ort.env.wasm.numThreads = 1;                       // sem cabeçalhos especiais (COOP/COEP): uma thread basta
    const transformers = await import(TJS_URL);
    const { loadMedia } = await import(MEDIA_URL);
    const poll = setInterval(() => { if (counted >= EXPECTED_BYTES * .995) enterPrep(); }, 500);
    try { model = await loadMedia({ manifest: MANIFEST_URL, modality: "image", modules: { ort, transformers }, device: "webgpu", visionDevice: "wasm", onStatus }); }
    finally { clearInterval(poll); }
    $("#bar").value = 100;
    const secs = (performance.now() - t0) / 1000;
    setStatus(sub(T.s_ready, { dev: model.device, s: num(secs) }));
    $("#load").hidden = true; $("#prog").hidden = true; $("#pergunta").hidden = false;
    store.set("vj-sessao", "1");
    try { Promise.resolve(ort.env.webgpu?.device).then((d) => d?.lost?.then((info) => { events.push({ t: Date.now(), e: "device-lost", reason: info?.reason }); notice(T.gpu_lost); })).catch(() => {}); } catch {}
    window.s1s2demo.loadMs = performance.now() - t0; window.s1s2demo.loadedBytes = counted;
    if (!current) pickExample(0);
  } catch (e) {
    console.error(e);
    setStatus(T.s_err + String(e?.message ?? e));
    $("#load").disabled = false; $("#load").textContent = sub(T.load, { gb: GB }); $("#prog").hidden = true;
  } finally { loading = false; }
}
$("#load").textContent = sub(T.load, { gb: GB });
$("#load").onclick = load;
$("#force").onclick = () => { $("#unsupported").hidden = true; $("#force").hidden = true; $("#load").hidden = false; load(); };
(async () => {
  const why = [];
  if (mobile) why.push(T.why_mobile);
  if (safari) why.push(T.why_safari);
  if (!(await hasGpu())) why.push(T.why_gpu);
  if (navigator.deviceMemory && navigator.deviceMemory < 8) why.push(T.why_mem);
  window.s1s2demo.unsupported = why;
  if (why.length) {
    $("#unsupported").textContent = sub(T.unsupported, { why: why.join("; ") }); $("#unsupported").hidden = false;
    $("#load").hidden = true; $("#force").hidden = false;
  }
})();

// ---- Imagem: exemplos, arquivo, arrastar e colar. Tudo vira um canvas de no máximo 1024 px no lado maior.
function toCanvas(img, w, h) {
  const k = Math.min(1, MAX_SIDE / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const g = c.getContext("2d", { willReadFrequently: true }); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);   // transparência vira branco
  g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function showImage(canvas, label) {
  current = { canvas, label };
  const p = $("#prev"); p.hidden = false; p.width = canvas.width; p.height = canvas.height; p.getContext("2d").drawImage(canvas, 0, 0);
  p.setAttribute("aria-label", label);
  $("#what").textContent = sub(T.what_x, { label, w: canvas.width, h: canvas.height }) + (model ? "" : " " + T.need_model);
  window.s1s2demo.image = { label, w: canvas.width, h: canvas.height };
}
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("image")); i.src = src; });
}
async function fromBlob(blob, label) {
  const url = URL.createObjectURL(blob);
  try { const i = await loadImg(url); showImage(toCanvas(i, i.naturalWidth, i.naturalHeight), label); exIndex = -1; markExample(); setChips(null); }
  catch (e) { console.error(e); setStatus(T.no_img); }
  finally { URL.revokeObjectURL(url); }
}
const exBox = $("#exemplos");
EXAMPLES.forEach((x, i) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.i = i; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<img src="exemplos/${x.id}.png" alt="" width="256" height="256"><span>${esc(en ? x.en : x.pt)}</span>`;
  b.onclick = () => pickExample(i); exBox.append(b);
});
function markExample() { for (const b of exBox.children) b.setAttribute("aria-pressed", String(Number(b.dataset.i) === exIndex)); }
async function pickExample(i) {
  const x = EXAMPLES[i];
  try { const img = await loadImg(`exemplos/${x.id}.png`); exIndex = i; markExample(); showImage(toCanvas(img, img.naturalWidth, img.naturalHeight), en ? x.en : x.pt); setChips(x); setQuestion(...x.qs[0]); chipIndex = 0; markChips(); }
  catch (e) { console.error(e); setStatus(T.no_img); }
}
$("#file").onchange = async (e) => { const f = e.target.files[0]; if (f) await fromBlob(f, T.up_label); e.target.value = ""; };
const zona = $("#zona");
for (const t of ["dragenter", "dragover"]) addEventListener(t, (e) => { if ([...(e.dataTransfer?.types ?? [])].includes("Files")) { e.preventDefault(); zona.classList.add("sobre-zona"); } });
for (const t of ["dragleave", "drop"]) addEventListener(t, () => zona.classList.remove("sobre-zona"));
addEventListener("drop", (e) => { const f = [...(e.dataTransfer?.files ?? [])].find((x) => x.type.startsWith("image/")); if (f) { e.preventDefault(); fromBlob(f, T.up_label); } });
addEventListener("paste", (e) => { const it = [...(e.clipboardData?.items ?? [])].find((x) => x.type.startsWith("image/")); const f = it?.getAsFile(); if (f) { e.preventDefault(); fromBlob(f, T.up_label); } });

// ---- Pergunta e opções (2 a 6)
const opts = $("#opcoes"), LETTERS = "ABCDEF";
function relabel() {
  [...opts.children].forEach((li, i) => { li.querySelector("b").textContent = LETTERS[i]; const inp = li.querySelector("input"); inp.setAttribute("aria-label", sub(T.opt_ph, { n: LETTERS[i] })); inp.placeholder = sub(T.opt_ph, { n: LETTERS[i] }); const r = li.querySelector("button"); r.setAttribute("aria-label", sub(T.remove, { n: LETTERS[i] })); r.hidden = opts.children.length <= MIN_OPTIONS; });
  $("#add").disabled = opts.children.length >= MAX_OPTIONS;
}
function addOption(v = "") {
  if (opts.children.length >= MAX_OPTIONS) return;
  const li = document.createElement("li");
  li.innerHTML = `<b></b><input type="text" class="opt" autocomplete="off" spellcheck="false" maxlength="120"><button type="button">×</button>`;
  li.querySelector("input").value = v; li.querySelector("input").onkeydown = (e) => { if (e.key === "Enter") ask(); };
  li.querySelector("button").onclick = () => { if (opts.children.length > MIN_OPTIONS) { li.remove(); relabel(); } };
  opts.append(li); relabel();
}
function setQuestion(q, o) { $("#q").value = q; opts.innerHTML = ""; o.forEach((v) => addOption(v)); while (opts.children.length < MIN_OPTIONS) addOption(); }
$("#add").onclick = () => { addOption(); opts.lastElementChild.querySelector("input").focus(); };
$("#q").onkeydown = (e) => { if (e.key === "Enter") ask(); };
const chips = $("#chips");
function setChips(x) {
  chips.innerHTML = ""; chips.hidden = !x; if (!x) return;
  x.qs.forEach(([q, o], i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = q; b.setAttribute("aria-pressed", "false"); b.onclick = () => { chipIndex = i; setQuestion(q, o); markChips(); }; chips.append(b); });
  markChips();
}
function markChips() { [...chips.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === chipIndex))); }
addOption(); addOption(); chips.hidden = true;

// ---- Perguntar
const ms = (v) => Math.round(v).toLocaleString(LANG);
function showResult(r, o) {
  const a = r.answers[0], probs = a.probabilities, best = a.choice;
  $("#resultados").hidden = false;
  $("#vence").innerHTML = `${esc(a.decision)}<small>${LETTERS[best]} · ${pct(a.probability)}</small>`;
  $("#prob").innerHTML = o.map((name, i) => `<li class="${i === best ? "venc" : ""}"><span>${LETTERS[i]}</span><span class="nome">${esc(name)}</span><span class="barra"><i style="width:${(probs[i] * 100).toFixed(1)}%"></i></span><b>${pct(probs[i])}</b></li>`).join("");
  $("#margem").textContent = sub(T.margin, { m: num(a.margin, 2) });
  const p = r.cost.parts ?? {};
  $("#tempo").textContent = sub(T.time, { dev: `${model.device} + wasm`, pre: ms(p.preprocess ?? 0), vis: num((p.vision ?? 0) / 1000), pfx: num((p.prefix ?? 0) / 1000), br: num((p.branches ?? 0) / 1000), tot: num(r.cost.ms / 1000) });
}
async function ask() {
  if (!model || !current || running) return;
  const q = $("#q").value.trim(), o = [...opts.querySelectorAll("input")].map((i) => i.value.trim());
  if (!q || o.length < MIN_OPTIONS || o.length > MAX_OPTIONS || o.some((v) => !v) || new Set(o.map((v) => v.toLowerCase())).size !== o.length) { setStatus(T.err_opts); return; }
  running = true; $("#ask").disabled = true; setStatus(T.working); $("#resultados").hidden = false; $("#vence").textContent = "…"; $("#prob").innerHTML = ""; $("#margem").textContent = ""; $("#tempo").textContent = "";
  try {
    const { canvas } = current;
    const d = canvas.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, canvas.width, canvas.height);
    const r = await model.decide({ image: { rgb: d.data, width: canvas.width, height: canvas.height, channels: 4 }, questions: [{ name: "choice", instruction: q, options: o }] });
    showResult(r, o); setStatus("");
    window.s1s2demo.last = { question: q, options: o, decision: r.answers[0].decision, choice: r.answers[0].choice, probability: r.answers[0].probability, probabilities: r.answers[0].probabilities, margin: r.answers[0].margin, ms: r.cost.ms, parts: r.cost.parts };
    return window.s1s2demo.last;
  } catch (err) { console.error(err); setStatus(T.err_run + String(err?.message ?? err)); $("#vence").textContent = "–"; }
  finally { running = false; $("#ask").disabled = false; }
}
$("#ask").onclick = ask;

// Ganchos para teste automático (não aparecem na página)
window.s1s2demo = Object.assign(window.s1s2demo ?? {}, { events, load, ask, pickExample, version: S1S2_VERSION, get model() { return model; } });
window.dispatchEvent(new Event("s1s2demo-ready"));
</script>
</body>
</html>
