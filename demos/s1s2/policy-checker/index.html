    h_details: "Detalhes e limites", h_credits: "Créditos e licenças", seeread: "Ver a leitura", q_label: "Pergunta", opts_label: "Opções", pick_label: "Escolha", prob_label: "probabilidade", margin_label: "margem",
    credit_lib: 'Biblioteca: <a href="https://github.com/eduardoworrel/s1s2.js">s1s2.js</a> (<code>@s1s2/web {v}</code>, MIT), com <a href="https://onnxruntime.ai/">ONNX Runtime Web</a> {o} e <a href="https://github.com/huggingface/transformers.js">Transformers.js</a> 4.3.1.',
    credit_base: 'Modelo-base: <a href="https://huggingface.co/maritaca-ai/S5-nano">S5-nano</a> (Maritaca AI), Apache-2.0.'
  },
  en: {
    nav_posts: "Posts", nav_about: "About", foot_write: "Write a post", foot_map: "Contribute to the map",
    h_model: "Model",
    req: "<b>Requirements.</b> A browser with WebGPU (recent Chrome or Edge, on a computer). The download is large (≈{gb} GB) and happens once: the model then stays stored in the browser. What you write never leaves the page.",
    gpu_yes: "WebGPU is available in this browser.", gpu_no: "WebGPU is not available here: this demo needs it.", gpu_check: "Checking WebGPU…",
    load: "Load the model (≈{gb} GB, downloads once)", load_cached: "Load the model (already stored in this browser)", loading: "Loading…", forget: "Delete the stored model",
    forgot: "Stored model deleted from this browser.", s_check: "Checking the files…", s_download: "Downloading", s_cache: "Reading from the browser", s_prep: "Preparing the model (may take a few seconds)…",
    s_ready: "Model ready ({s} s).", s_loaded: "Model loaded", s_err: "Could not load the model: ", s_nogpu: "No WebGPU",
    h_details: "Details and limits", h_credits: "Credits and licences", seeread: "See the reading", q_label: "Question", opts_label: "Options", pick_label: "Choice", prob_label: "probability", margin_label: "margin",
    credit_lib: 'Library: <a href="https://github.com/eduardoworrel/s1s2.js">s1s2.js</a> (<code>@s1s2/web {v}</code>, MIT), with <a href="https://onnxruntime.ai/">ONNX Runtime Web</a> {o} and <a href="https://github.com/huggingface/transformers.js">Transformers.js</a> 4.3.1.',
    credit_base: 'Base model: <a href="https://huggingface.co/maritaca-ai/S5-nano">S5-nano</a> (Maritaca AI), Apache-2.0.'
  }
};
const qs = new URLSearchParams(location.search);
const LANG = (qs.get("lang") ?? navigator.language ?? "en").toLowerCase().startsWith("pt") ? "pt-BR" : "en";
const en = LANG === "en";
const T = { ...COMMON_TX[LANG], ...PAGE_TX[LANG] };
const sub = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const num = (v, d = 1) => v.toLocaleString(LANG, { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v) => (v > 0.995 && v < 1 ? ">99 %" : v < 0.005 && v > 0 ? "<1 %" : `${Math.round(v * 100)} %`);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MODEL_GB_TXT = num(MODEL_BYTES / 1e9);

document.documentElement.lang = LANG;
$("#home").href = en ? "/en/" : "/";
$("#foot-home").href = en ? "/en/" : "/";
$("#about").href = en ? "/en/about.html" : "/sobre.html";
const sw = $("#trocar"); sw.href = `?lang=${en ? "pt-BR" : "en"}`; sw.textContent = en ? "Português" : "English"; sw.lang = en ? "pt-BR" : "en"; sw.hreflang = sw.lang;
document.title = `${T.title} · webai.blog.br`;
for (const e of document.querySelectorAll("[data-t]")) e.textContent = T[e.dataset.t];
for (const e of document.querySelectorAll("[data-h]")) e.innerHTML = sub(T[e.dataset.h], { gb: MODEL_GB_TXT });
$("#limits").innerHTML = T.limits.map((x) => `<li>${x}</li>`).join("");
$("#credits").innerHTML = [...T.credits, T.credit_base, T.credit_lib].map((x) => `<li>${sub(x, { v: S1S2_VERSION, o: ORT_VERSION })}</li>`).join("");

const setStatus = (s) => { $("#status").textContent = s; };
let hasGpu = false, loaded = false;
(async () => {
  $("#gpu").textContent = T.gpu_check;
  try { hasGpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch { hasGpu = false; }
  $("#gpu").textContent = hasGpu ? T.gpu_yes : T.gpu_no;
  if (!hasGpu) { $("#load").disabled = true; $("#load").textContent = T.s_nogpu; }
})();

// ---- Cache dos arquivos grandes do Hub (Cache Storage), com contagem de bytes para a barra.
// O Hub responde ao redirecionamento com cache-control: no-store, então o navegador não guardaria o arquivo sozinho.
let counted = 0, fromCache = false, prepared = false;
async function openCache() { try { return await caches.open(CACHE_NAME); } catch { return null; } }
function counter() { return new TransformStream({ transform(c, ctl) { counted += c.byteLength; setProgress(); ctl.enqueue(c); } }); }
function setProgress() {
  const p = Math.min(99, Math.round(counted / MODEL_BYTES * 100));
  $("#bar").value = p;
  setStatus(p >= 99 && counted >= MODEL_BYTES * 0.999 ? T.s_prep : `${fromCache ? T.s_cache : T.s_download}: ${p} %`);
}
const ownUrl = (u) => HUB_PREFIXES.some((p) => u.startsWith(p));
function installFetch() {
  if (window.__s1s2Fetch) return;
  const orig = window.fetch.bind(window);
  window.__s1s2Fetch = true;
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    const method = (init?.method ?? (input instanceof Request ? input.method : "GET")).toUpperCase();
    const headers = new Headers(init?.headers ?? (input instanceof Request ? input.headers : undefined));
    if (!ownUrl(url) || method !== "GET" || headers.has("range")) return orig(input, init);
    const cache = await openCache();
    if (cache) {
      const hit = await cache.match(url, { ignoreVary: true }).catch(() => null);
      if (hit?.body) { fromCache = true; return new Response(hit.body.pipeThrough(counter()), { status: 200, headers: hit.headers }); }
    }
    const r = await orig(input, init);
    const size = Number(r.headers.get("content-length") ?? 0);
    if (!r.ok || !r.body || (size > 0 && size < 50e6) || (size === 0 && !/\.data$/.test(url))) return r;
    fromCache = false;
    if (cache) {
      try {
        await cache.put(url, new Response(r.body.pipeThrough(counter()), { status: 200, headers: r.headers }));
        const saved = await cache.match(url, { ignoreVary: true });
        if (saved?.body) return new Response(saved.body, { status: 200, headers: saved.headers });
      } catch { await cache.delete(url).catch(() => {}); return orig(input, init); }   // sem espaço ou sem Cache Storage: baixa sem guardar
    }
    return new Response(r.body.pipeThrough(counter()), { status: 200, headers: r.headers });
  };
}
async function cachedKeys() {
  const cache = await openCache();
  const ks = cache ? await cache.keys().catch(() => []) : [];
  return ks.filter((k) => ownUrl(k.url));
}
async function refreshCached() {
  const n = (await cachedKeys()).length;
  $("#forget").hidden = n === 0;
  if (!loaded && hasGpu !== false) $("#load").textContent = sub(n >= 1 ? T.load_cached : T.load, { gb: MODEL_GB_TXT });
  return n;
}
$("#forget").onclick = async () => {
  const cache = await openCache();
  for (const k of await cachedKeys()) await cache?.delete(k).catch(() => {});
  setStatus(T.forgot); await refreshCached();
};
$("#load").textContent = sub(T.load, { gb: MODEL_GB_TXT });
refreshCached();

const statuses = [];
const onStatus = (m) => { statuses.push(m); if (!counted && !loaded) setStatus(T.s_check); };
async function startLoad(doLoad) {
  if (loaded) return;
  installFetch();
  $("#load").disabled = true; $("#load").textContent = T.loading; $("#prog").hidden = false; $("#bar").value = 0; counted = 0; setStatus(T.s_check);
  const t0 = performance.now();
  try {
    await doLoad();
    loaded = true; $("#bar").value = 100;
    const s = (performance.now() - t0) / 1000;
    $("#load").textContent = T.s_loaded;
    setStatus(sub(T.s_ready, { s: num(s) }));
    window.s1s2demo = { loadS: s, countedBytes: counted, fromCache, statuses };
    onReady();
  } catch (e) {
    console.error(e);
    setStatus(T.s_err + (e?.message ?? e)); $("#load").disabled = !hasGpu; $("#load").textContent = sub(T.load, { gb: MODEL_GB_TXT });
    window.s1s2demo = { error: String(e?.message ?? e), statuses };
  }
  refreshCached();
}
$("#load").addEventListener("click", () => startLoad(loadModel));
ort.env.logLevel = "error";
ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths = ORT_BASE;

let REQ = null, LAW = "GDPR", lib = null, libKey = null, last = null;
const keyOf = (law) => (law === "LGPD" ? "pt" : "en");

async function loadLib(key) {
  if (lib && libKey === key) return lib;
  if (lib) { await lib.dispose?.(); lib = null; libKey = null; }   // um só modelo na memória da placa de vídeo por vez
  const manifest = await (await fetch(MANIFEST_URL[key])).json();
  lib = await S1S2.load({ manifest, build: "genai-int4-webgpu", modules: { ort, transformers: tjs }, genai: { verifyEp: true }, onStatus });
  libKey = key;
  return lib;
}
async function loadModel() {
  REQ = await (await fetch("./requirements.json")).json();
  await loadLib(keyOf(LAW));
}
function onReady() { $("#run").disabled = false; $("#run").textContent = T.run; }
$("#run").textContent = T.run_wait;
const sample = (law) => (law === "LGPD" ? SAMPLE_PT : SAMPLE_EN);
$("#text").value = sample(LAW);
document.querySelectorAll(".lei").forEach((b) => b.addEventListener("click", () => {
  const prev = LAW;
  LAW = b.dataset.law;
  document.querySelectorAll(".lei").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const cur = $("#text").value.trim();
  if (cur === SAMPLE_EN || cur === SAMPLE_PT) $("#text").value = sample(LAW);
  if (prev !== LAW) { last = null; $("#resultados").hidden = true; }
}));

/** Divide a política em trechos: parágrafos, linhas curtas juntadas até ~40 palavras, longas cortadas nas frases (~220 palavras). */
function splitPassages(text) {
  const paras = text.replace(/\r/g, "").split(/\n\s*\n|\n(?=\s*(?:[-•*]|\d+[.)]|[A-Z][A-Z \d&,'-]{3,}$))/m)
    .map((p) => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  const out = [];
  let buf = "";
  const words = (s) => (s.match(/\S+/g) || []).length;
  const push = (p) => {
    if (words(p) <= 220) { out.push(p); return; }
    let cur = "";
    for (const s of p.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [p]) {
      if (cur && words(cur) + words(s) > 220) { out.push(cur.trim()); cur = ""; }
      cur += s;
    }
    if (cur.trim()) out.push(cur.trim());
  };
  for (const p of paras) {
    buf = buf ? buf + " " + p : p;
    if (words(buf) >= 40) { push(buf); buf = ""; }
  }
  if (buf) { if (out.length && words(buf) < 15) out[out.length - 1] += " " + buf; else push(buf); }
  return out;
}
const question = (law, r) => law.question.replace("{name}", r.name_of).replace("{definition}", r.definition);

async function run() {
  const law = REQ.laws[LAW];
  const text = $("#text").value.trim();
  if (!text) { $("#runstatus").textContent = T.empty; return; }
  const reqs = law.requirements.filter((r) => !$("#primaryOnly").checked || r.primary);
  const passages = splitPassages(text);
  $("#run").disabled = true;
  try {
    if (libKey !== keyOf(LAW)) { $("#runstatus").textContent = T.switching; counted = 0; $("#prog").hidden = false; }
    const m = await loadLib(keyOf(LAW));
    const yes = m.manifest.lab.labels.yes, no = m.manifest.lab.labels.no;
    const best = reqs.map(() => ({ p: -1, i: -1 }));
    const t0 = performance.now();
    let skipped = 0;
    for (const [i, passage] of passages.entries()) {
      $("#runstatus").textContent = sub(T.reading, { i: i + 1, n: passages.length });
      if (m.countTokens(passage) > 900) { skipped++; continue; }
      // As duas ordens das opções, em média: a decisão não depende de onde o "Sim" está na lista.
      const pYes = [];
      for (const order of [[yes, no], [no, yes]]) {
        const s = await m.decide({ input: passage, questions: reqs.map((r) => ({ name: r.code, type: "choice", instructions: question(law, r), choices: order })) }, { keepState: false });
        s.answers.forEach((a, k) => { pYes[k] = (pYes[k] ?? 0) + a.probabilities.find((x) => x.value === yes).probability / 2; });
        await s.dispose();
      }
      pYes.forEach((p, k) => { if (p > best[k].p) best[k] = { p, i }; });
    }
    const rows = reqs.map((r, k) => ({ r, ...best[k], addressed: best[k].p >= 0.5 }));
    if ($("#quote").checked) {
      for (const row of rows.filter((x) => x.addressed)) {
        $("#runstatus").textContent = sub(T.quoting, { n: reqName(row.r) });
        const prompt = law.quote.replace("{passage}", passages[row.i]).replace("{name}", row.r.name_of).replace("{definition}", row.r.definition);
        row.quote = (await m.generate(prompt, { maxNewTokens: 96, temperature: 0 })).text.trim();
      }
    }
    last = { rows, passages, secs: (performance.now() - t0) / 1000, skipped };
    render(last);
    $("#runstatus").textContent = "";
    window.s1s2demo.result = rows.map((x) => ({ code: x.r.code, p: x.p, addressed: x.addressed, passage: x.i }));
    window.s1s2demo.secs = last.secs; window.s1s2demo.done = true;
  } catch (e) { $("#runstatus").textContent = `Erro: ${e?.message ?? e}`; console.error(e); }
  finally { $("#run").disabled = false; }
}
$("#run").addEventListener("click", run);

function render(st) {
  const n = st.rows.filter((x) => x.addressed).length;
  $("#resultados").hidden = false;
  $("#summary").innerHTML = `<span class="grande">${n} / ${st.rows.length}</span> ${T.of_req}<br><span class="fraco">${LAW} · ${st.passages.length} ${T.passages} · ${num(st.secs)} ${T.s}${st.skipped ? ` · ${st.skipped} ${T.toolong_skip}` : ""}</span>`;
  $("#results").innerHTML = st.rows.map((x) => {
    const p = Math.max(0, x.p);
    return `<article class="item"><p class="msg"><b>${esc(reqName(x.r))}</b>${x.r.primary ? "" : ` <span class="tag">${T.secondary}</span>`}<br><span class="fraco">${esc(x.r.cites.slice(0, 2).join("; "))}</span></p>
      <div class="dec"><span class="resp ${x.addressed ? "sim" : "nd"}">${x.addressed ? T.addressed : T.notfound}</span><span class="prob">${pct(x.addressed ? p : 1 - p)}</span></div>
      <div class="barra"><i style="width:${Math.round(100 * (x.addressed ? p : 1 - p))}%"></i></div>
      ${x.i >= 0 ? `<details class="leitura"><summary>${T.best}: ${T.passage} ${x.i + 1}</summary><blockquote class="trecho">${esc(st.passages[x.i].slice(0, 900))}</blockquote></details>` : ""}
      ${x.quote ? `<blockquote class="trecho">${esc(x.quote)}</blockquote>` : ""}</article>`;
  }).join("");
}

</script>
