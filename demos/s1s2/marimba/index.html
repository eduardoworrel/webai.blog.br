  if (!hasTranscribe() || !enc) return;
  const mine = clip, t0 = performance.now();
  $("#transcribe").disabled = true; $("#tr-state").textContent = T.transcribing; $("#tr-text").textContent = "";
  try {
    const tr = await model.transcribe(enc);
    if (mine !== clip) return;
    const s = (performance.now() - t0) / 1000;
    $("#tr-text").textContent = tr.text || T.tr_empty;
    $("#tr-det").textContent = sub(T.tr_det, { n: tr.tokens, s: num(s), lang: tr.language ? langName(tr.language) : "–" });
    $("#tr-state").textContent = "";
    costParts.tr = s * 1000; showCost();
    window.s1s2demo.transcription = tr;
  } catch (err) { console.error(err); $("#tr-state").textContent = String(err?.message ?? err); }
  finally { if (mine === clip) $("#transcribe").disabled = false; }
}
$("#transcribe").onclick = transcribe;

// Ganchos para teste automático (não aparecem na página)
window.s1s2demo = { events, loopGuard, preferLight,  load, fromUrls, setSamples, run, ask, transcribe, version: S1S2_VERSION, get model() { return model; } };
window.dispatchEvent(new Event("s1s2demo-ready"));
</script>
