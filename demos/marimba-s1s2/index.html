    q_trans: "Transcript", trans_note: "The decoder writes the text of the 8 s window. Slower than the answers above; validated on Portuguese only, and int4 may change a word or a spelling.", transcribe: "Transcribe", transcribing: "Transcribing…",
    tr_det: "{n} tokens · {s} s · language written by the model: {lang}", tr_empty: "(no text: silence or noise)",
    h_limits: "Limits",
    limits: ["Only Portuguese was validated. The other 29 languages appear in the list but were not checked.", "On audio that is not speech (noise, music) the reported language may change and means nothing.", "int4 (4-bit weights) changes the transcribed text: a word or a spelling can differ from the original model.", "End of turn, same person, change and speaker count need 8 s of audio; with less, the page says so.", "This is a research demo. Do not use it for diagnosis, to identify people or in critical automation."],
    h_credits: "Credits and licences",
    credits: ['Base model: <a href="https://huggingface.co/Qwen/Qwen3-ASR-0.6B">Qwen3-ASR-0.6B</a> (Qwen), Apache-2.0.', 'Marimba (Charcot): <a href="https://arxiv.org/abs/2611.18330">arXiv 2611.18330</a> and <a href="https://huggingface.co/charcot-ai/marimba">charcot-ai/marimba</a>, Apache-2.0. The end-of-turn question uses data from <a href="https://huggingface.co/datasets/pipecat-ai/smart-turn-data-v3.2-train">smart-turn v3.2</a> (CC BY 4.0).', 'ONNX weights: <a href="https://huggingface.co/eduardoworrel/Marimba-ONNX-S1S2">eduardoworrel/Marimba-ONNX-S1S2</a> on Hugging Face, Apache-2.0.', 'Library: <a href="https://github.com/eduardoworrel/s1s2.js">s1s2.js</a> (<code>@s1s2/web {v}</code>), with <a href="https://onnxruntime.ai/">ONNX Runtime Web</a> {o}.', 'Example clips: <a href="https://huggingface.co/datasets/google/fleurs">FLEURS</a> (Google), Brazilian Portuguese, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, converted to 16 kHz WAV with no cuts; the noise was generated. <a href="clips/ATTRIBUTION.md">Attribution</a>.']
  }
};
const qs = new URLSearchParams(location.search);
const LANG = (qs.get("lang") ?? navigator.language ?? "en").toLowerCase().startsWith("pt") ? "pt-BR" : "en";
const T = TX[LANG];
const sub = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const num = (v, d = 1) => v.toLocaleString(LANG, { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v) => `${num(v * 100)} %`;
const $ = (s) => document.querySelector(s);

document.documentElement.lang = LANG;
const en = LANG === "en";
$("#home").href = en ? "/en/" : "/";
$("#foot-home").href = en ? "/en/" : "/";
$("#about").href = en ? "/en/about.html" : "/sobre.html";
const sw = $("#trocar"); sw.href = `?lang=${en ? "pt-BR" : "en"}`; sw.textContent = en ? "Português" : "English"; sw.lang = en ? "pt-BR" : "en"; sw.hreflang = sw.lang;
document.title = `${T.title} · webai.blog.br`;
for (const e of document.querySelectorAll("[data-t]")) e.textContent = T[e.dataset.t];
for (const e of document.querySelectorAll("[data-h]")) e.innerHTML = sub(T[e.dataset.h], { gb: MODEL_GB });
for (const b of document.querySelectorAll(".ex[data-n]")) b.textContent = sub(T.ex_n, { n: b.dataset.n });
$("#term").placeholder = T.ph;
$("#limits").innerHTML = T.limits.map((x) => `<li>${x}</li>`).join("");
$("#credits").innerHTML = T.credits.map((x) => `<li>${sub(x, { v: S1S2_VERSION, o: ORT_VERSION })}</li>`).join("");
$("#wave").setAttribute("aria-label", T.wave_alt);

// ---- Estado
let model = null, enc = null, samples = null, clip = 0, ort = null;
const hasTranscribe = () => typeof model?.transcribe === "function";
const setStatus = (s) => { $("#status").textContent = s; };
let costParts = { lang: null, word: null, tr: null }, costBase = "";

// ---- WebGPU
let hasGpu = false;
(async () => {
  $("#gpu").textContent = T.gpu_check;
  try { hasGpu = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch { hasGpu = false; }
  $("#gpu").textContent = hasGpu ? T.gpu_yes : T.gpu_no;
})();

// ---- Cache dos arquivos grandes do Hub (Cache Storage), com contagem de bytes para a barra
let counted = 0, fromCache = false;
async function openCache() { try { return await caches.open(CACHE_NAME); } catch { return null; } }
function counter() { return new TransformStream({ transform(c, ctl) { counted += c.byteLength; setProgress(); ctl.enqueue(c); } }); }
function setProgress() {
  const p = Math.min(99, Math.round(counted / EXPECTED_BYTES * 100));
  $("#bar").value = p;
  setStatus(`${fromCache ? T.s_cache : T.s_download}: ${p} %`);
}
function installFetch() {
  if (window.__marimbaFetch) return;
  const orig = window.fetch.bind(window);
  window.__marimbaFetch = true;
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    const method = (init?.method ?? (input instanceof Request ? input.method : "GET")).toUpperCase();
    const headers = new Headers(init?.headers ?? (input instanceof Request ? input.headers : undefined));
    if (!url.startsWith(HUB_PREFIX) || method !== "GET" || headers.has("range")) return orig(input, init);
    const cache = await openCache();
    if (cache) {
      const hit = await cache.match(url, { ignoreVary: true }).catch(() => null);
      if (hit?.body) { fromCache = true; return new Response(hit.body.pipeThrough(counter()), { status: 200, headers: hit.headers }); }
    }
    const r = await orig(input, init);
    const size = Number(r.headers.get("content-length") ?? 0);
    if (!r.ok || !r.body || size < 50e6) return r;
    fromCache = false;
    if (cache) {
      try {
        await cache.put(url, new Response(r.body.pipeThrough(counter()), { status: 200, headers: r.headers }));
        const saved = await cache.match(url, { ignoreVary: true });
        if (saved?.body) return new Response(saved.body, { status: 200, headers: saved.headers });
      } catch { await cache.delete(url).catch(() => {}); return orig(input, init); }   // sem espaço ou sem Cache Storage: baixa sem guardar
    }
    return new Response(r.body.pipeThrough(counter()), { status: 200, headers: r.headers });
  };
}
async function refreshCached() {
  const cache = await openCache();
  const n = cache ? (await cache.keys().catch(() => [])).length : 0;
  $("#forget").hidden = n === 0;
  if (!model) $("#load").textContent = sub(n >= 2 ? T.load_cached : T.load, { gb: MODEL_GB });
  return n;
}
$("#forget").onclick = async () => { try { await caches.delete(CACHE_NAME); } catch {} setStatus(T.forgot); await refreshCached(); };
$("#load").textContent = sub(T.load, { gb: MODEL_GB });
refreshCached();

// ---- Carregar o modelo
const STAGE = [[/audio readers/, "st_readers"], [/audio tower/, "st_tower"], [/decoder tokens/, "st_tokens"], [/decoder embeddings/, "st_emb"], [/loading decoder/, "st_dec"], [/decoder not loaded/, "st_nodec"]];
function onStatus(m) {
  const hit = STAGE.find(([re]) => re.test(m));
  if (hit) setStatus(T[hit[1]]);          // durante o download, a porcentagem da barra toma o lugar
}
async function load() {
  const t0 = performance.now();
  $("#load").disabled = true; $("#load").textContent = T.loading; $("#prog").hidden = false; $("#bar").value = 0; counted = 0;
  try {
    installFetch();
    ort = await import(`${ORT_BASE}ort.webgpu.min.mjs`);
    ort.env.wasm.wasmPaths = ORT_BASE;
    ort.env.wasm.numThreads = 1;                       // sem cabeçalhos especiais (COOP/COEP): uma thread basta
    const { loadMedia } = await import(MEDIA_URL);
    const poll = setInterval(() => { if (counted >= EXPECTED_BYTES * .995) setStatus(T.s_prep); }, 500);
    try { model = await loadMedia({ manifest: MANIFEST_URL, modules: { ort }, decoder: "auto", onStatus }); }
    finally { clearInterval(poll); }
    $("#bar").value = 100;
    const secs = (performance.now() - t0) / 1000;
    setStatus(sub(T.s_ready, { dev: model.device, s: num(secs) }));
    $("#load").hidden = true; $("#prog").hidden = true;
    const dec = !!model.decoder?.loaded;
    $('[data-task="language"]').hidden = !(dec && model.tasks.includes("language"));
    $('[data-task="term"]').hidden = !(dec && model.tasks.includes("term"));
    $("#tr-card").hidden = !(dec && hasTranscribe());
    if (model.decoder && !dec) setStatus(T.st_nodec);
    window.s1s2demo.loadMs = performance.now() - t0; window.s1s2demo.loadedBytes = counted;
    refreshCached();
    if (samples) run();
  } catch (e) {
    console.error(e);
    setStatus(T.s_err + String(e?.message ?? e));
    $("#load").disabled = false; $("#load").textContent = sub(T.load, { gb: MODEL_GB }); $("#prog").hidden = true;
  }
}

// ---- Áudio: decodificar, reamostrar para 16 kHz mono, últimos 8 s
async function toMono16k(buf) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  let a; try { a = await ac.decodeAudioData(buf.slice(0)); } finally { ac.close?.(); }
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(a.duration * 16000)), 16000);
  const src = off.createBufferSource(); src.buffer = a; src.connect(off.destination); src.start();
  return (await off.startRendering()).getChannelData(0).slice();
}
function draw(x) {
  const c = $("#wave"), g = c.getContext("2d"), W = c.width, H = c.height;
  const css = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, W, H); g.fillStyle = css.getPropertyValue("--accent").trim() || "#b84a00";
  const step = Math.max(1, Math.floor(x.length / W));
  for (let px = 0; px < W; px++) {
    let lo = 0, hi = 0;
    for (let i = px * step; i < Math.min(x.length, (px + 1) * step); i++) { if (x[i] < lo) lo = x[i]; if (x[i] > hi) hi = x[i]; }
    g.fillRect(px, H / 2 - hi * H * .9, 1, Math.max(1, (hi - lo) * H * .9));
  }
}
async function setSamples(x, label) {
  const cut = x.length > WIN ? x.slice(x.length - WIN) : x;
  samples = cut; draw(cut);
  $("#what").textContent = sub(T.what_x, { label, s: num(x.length / 16000), w: num(Math.min(WIN, x.length) / 16000) }) + (model ? "" : " " + T.need_model);
  window.s1s2demo.samples = cut;
  return run();
}
async function fromUrls(list) {
  const parts = [];
  for (const u of list) parts.push(await toMono16k(await (await fetch(u)).arrayBuffer()));
  const x = new Float32Array(parts.reduce((s, p) => s + p.length, 0)); let o = 0;
  for (const p of parts) { x.set(p, o); o += p.length; }
  const names = list.map((u) => u.split("/").pop().replace(".wav", ""));
  return setSamples(x, names.join(" + "));
}
for (const b of document.querySelectorAll(".ex")) b.onclick = () => fromUrls(b.dataset.src.split(",")).catch((e) => { console.error(e); setStatus(T.dec_no); });
$("#file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { await setSamples(await toMono16k(await f.arrayBuffer()), f.name); } catch (err) { console.error(err); setStatus(T.dec_no); }
  e.target.value = "";
};
$("#rec").onclick = async () => {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    const done = new Promise((r) => { rec.onstop = r; });
    $("#rec").disabled = true; rec.start();
    let left = 8; $("#rec").textContent = sub(T.rec_now, { s: left });
    const tick = setInterval(() => { left -= 1; $("#rec").textContent = sub(T.rec_now, { s: Math.max(0, left) }); }, 1000);
    setTimeout(() => rec.state === "recording" && rec.stop(), 8000);
    await done; clearInterval(tick);
    stream.getTracks().forEach((t) => t.stop());
    await setSamples(await toMono16k(await new Blob(chunks).arrayBuffer()), T.mic_label);
  } catch (e) { console.error(e); setStatus(T.mic_no + (e?.name ?? e)); stream?.getTracks().forEach((t) => t.stop()); }
  finally { $("#rec").disabled = false; $("#rec").textContent = T.rec; }
};
$("#rec").textContent = T.rec;

// ---- Mostrar as respostas
function show(a) {
  const el = $(`[data-task="${a.task}"]`); if (!el) return;
  const r = el.querySelector(".resp"), bar = el.querySelector(".barra i"), d = el.querySelector(".det");
  if (!a.available) {
    r.textContent = "–"; r.className = "resp nd"; if (bar) bar.style.width = "0";
    d.textContent = /^needs a full window/.test(a.reason ?? "") ? T.needs : (a.reason ?? ""); return;
  }
  if (a.task === "speaker_count") {
    const lab = (v) => { const s = String(v); return T.sp[/^3/.test(s) ? 3 : Number(s)] ?? s; };
    r.textContent = lab(a.choice); r.className = "resp";
    d.textContent = `${T.m} ${num(a.margin, 2)} · ` + a.probabilities.map((p) => `${lab(p.value)}: ${pct(p.probability)}`).join(" · ");
    bar.style.width = `${(a.margin ?? 0) * 100}%`; return;
  }
  const yes = a.decision === "yes";
  r.textContent = yes ? T.yes : T.no; r.className = "resp " + (yes ? "sim" : "nao");
  d.textContent = `${T.p} ${pct(a.probability)} · ${T.m} ${num(a.margin, 2)}` + (a.threshold && a.threshold !== 0.5 ? ` · ${sub(T.decides, { t: num(a.threshold, 3) })}` : "");
  bar.style.width = `${(a.margin ?? 0) * 100}%`;
}
const langName = (code) => { try { return new Intl.DisplayNames([LANG], { type: "language" }).of(code) ?? code; } catch { return code; } };
function showLanguage(a) {
  const el = $('[data-task="language"]'), r = el.querySelector(".resp"), ul = el.querySelector(".idiomas"), d = el.querySelector(".det");
  const info = model.spec.decoder.languages, nm = (c) => (langName(c) !== c ? langName(c) : info[c]?.name ?? c);
  if (!a.available) { r.textContent = "–"; r.className = "resp nd"; ul.innerHTML = ""; d.textContent = a.reason ?? ""; return; }
  r.textContent = nm(a.choice); r.className = "resp";
  const top = [...a.probabilities].sort((x, y) => y.probability - x.probability).slice(0, 5);
  ul.innerHTML = top.map((p) => `<li><span>${nm(p.value)}</span><span class="barra"><i style="width:${(p.probability * 100).toFixed(1)}%"></i></span><b>${pct(p.probability)}</b></li>`).join("");
  d.textContent = `${T.m} ${num(a.margin, 2)}`;
}
function showCost() {
  if (!costBase) return;
  const c = costParts;
  $("#cost").textContent = costBase + (c.lang != null ? sub(T.cost_lang, { ms: c.lang.toFixed(0) }) : "") + (c.word != null ? sub(T.cost_word, { s: num(c.word / 1000) }) : "") + (c.tr != null ? sub(T.cost_tr, { s: num(c.tr / 1000) }) : "");
}

async function run() {
  if (!model || !samples) return;
  const mine = ++clip, five = ["voice_activity", "turn_end", "same_speaker", "speaker_change", "speaker_count"];
  $("#resultados").hidden = false;
  $("#term").disabled = $("#ask").disabled = true; $("#transcribe").disabled = true;
  $("#term-resp").textContent = ""; $("#term-det").textContent = ""; $("#hyp").hidden = true; $("#tr-text").textContent = ""; $("#tr-det").textContent = ""; $("#tr-state").textContent = "";
  costParts = { lang: null, word: null, tr: null };
  try {
    const t0 = performance.now();
    const e = await model.encode({ samples, sampleRate: 16000 });
    if (mine !== clip) return;
    enc = e;
    const t1 = performance.now(), answers = await model.read(e, five), t2 = performance.now();
    if (mine !== clip) return;
    for (const a of answers) show(a);
    costBase = sub(T.cost, { dev: model.device, mel: e.ms.mel.toFixed(0), tower: e.ms.tower.toFixed(0), read: (t2 - t1).toFixed(0) });
    showCost();
    const out = { answers, ms: { mel: e.ms.mel, tower: e.ms.tower, readers: t2 - t1 } };
    window.s1s2demo.last = out;
    if (model.decoder?.loaded && model.tasks.includes("language")) {
      const tl = performance.now(), la = (await model.read(e, ["language"]))[0];
      if (mine !== clip) return;
      showLanguage(la); costParts.lang = performance.now() - tl; showCost(); out.language = la; out.ms.language = costParts.lang;
    }
    $("#term").disabled = $("#ask").disabled = false; $("#transcribe").disabled = false;
    return out;
  } catch (err) { console.error(err); setStatus(String(err?.message ?? err)); }
}

// ---- Palavra dita: n/5 e as hipóteses
async function ask() {
  const term = $("#term").value.trim();
  if (!model || !enc || !term) return;
  const mine = clip, t0 = performance.now();
  $("#ask").disabled = true; $("#term-resp").textContent = T.asking; $("#term-resp").className = "resp nd";
  try {
    const a = (await model.read(enc, [{ task: "term", term }]))[0];
    if (mine !== clip) return;
    const el = $("#term-resp"), det = $("#term-det"), hy = $("#hyp");
    if (!a.available) { el.textContent = "–"; det.textContent = a.reason ?? ""; return; }
    const yes = a.decision === "yes", n = Math.round(a.probability * 5);
    el.textContent = yes ? T.yes : T.no; el.className = "resp " + (yes ? "sim" : "nao");
    det.textContent = sub(T.n_of, { n });
    hy.hidden = !a.hypotheses?.length;
    hy.innerHTML = (a.hypotheses ?? []).map((h) => `<li>${h ? esc(h) : "…"}</li>`).join("");
    hy.setAttribute("aria-label", T.hyp_title);
    costParts.word = performance.now() - t0; showCost();
    window.s1s2demo.term = a;
    return a;
  } catch (err) { console.error(err); setStatus(String(err?.message ?? err)); }
  finally { if (mine === clip) $("#ask").disabled = false; }
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("#ask").onclick = ask;
$("#term").onkeydown = (e) => { if (e.key === "Enter") ask(); };

// ---- Transcrição (System 2): só existe com @s1s2/web >= 0.2.1 (audio.transcribe)
async function transcribe() {
  if (!hasTranscribe() || !enc) return;
  const mine = clip, t0 = performance.now();
  $("#transcribe").disabled = true; $("#tr-state").textContent = T.transcribing; $("#tr-text").textContent = "";
  try {
    const tr = await model.transcribe(enc);
    if (mine !== clip) return;
    const s = (performance.now() - t0) / 1000;
    $("#tr-text").textContent = tr.text || T.tr_empty;
    $("#tr-det").textContent = sub(T.tr_det, { n: tr.tokens, s: num(s), lang: tr.language ? langName(tr.language) : "–" });
    $("#tr-state").textContent = "";
    costParts.tr = s * 1000; showCost();
    window.s1s2demo.transcription = tr;
  } catch (err) { console.error(err); $("#tr-state").textContent = String(err?.message ?? err); }
  finally { if (mine === clip) $("#transcribe").disabled = false; }
}
$("#transcribe").onclick = transcribe;
$("#load").onclick = load;

// Ganchos para teste automático (não aparecem na página)
window.s1s2demo = { load, fromUrls, setSamples, run, ask, transcribe, version: S1S2_VERSION, get model() { return model; } };
window.dispatchEvent(new Event("s1s2demo-ready"));
</script>
