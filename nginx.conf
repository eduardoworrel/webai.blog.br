server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # /meu-post e /meu-post.html servem o mesmo arquivo
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    location ~* \.(png|jpe?g|webp|gif|svg|css)$ {
        expires 7d;
    }
    location ~* \.(html|xml)$ {
        try_files $uri =404;
        expires 5m;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/xml application/rss+xml image/svg+xml;
}
