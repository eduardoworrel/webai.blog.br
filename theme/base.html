<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">$hreflang
<meta property="og:title" content="$og_title">
<meta property="og:description" content="$description">
<meta property="og:type" content="$og_type">
<meta property="og:url" content="$canonical">
<meta property="og:locale" content="$og_locale">$og_alt$og_image
<meta name="color-scheme" content="light">
<link rel="icon" href="${root}favicon.svg" type="image/svg+xml">
<link rel="preload" href="${root}fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="${root}style.css">
<link rel="alternate" type="application/rss+xml" title="$site_title" href="$feed">
</head>
<body>
<header class="topo">
<a class="marca" href="$home"><img src="${root}logo.svg" alt="" width="28" height="28"><span>$site_title</span></a>
<nav>$nav</nav>
</header>
<main>
$content
</main>
<footer class="rodape">
<p>$footer</p>
</footer>
<script>
(function(){var l=document.querySelector(".lido");if(!l)return;var b=l.querySelector("i"),n=l.querySelector("b");
function f(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight,p=m>0?Math.min(100,Math.max(0,Math.round(h.scrollTop/m*100))):0;b.style.width=p+"%";n.textContent=p+"%"}
addEventListener("scroll",f,{passive:true});addEventListener("resize",f);f();
document.querySelectorAll(".copiar").forEach(function(c){c.addEventListener("click",function(){var t=c.textContent;
(navigator.clipboard?navigator.clipboard.writeText(location.href.split("#")[0]):Promise.reject()).then(function(){c.textContent=c.dataset.ok;setTimeout(function(){c.textContent=t},1800)}).catch(function(){})})})})();
</script>
</body>
</html>
